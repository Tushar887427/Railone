name: Build Android APK

on:
  push:
    branches:
      - arena/e9f157a0-railone
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK and accept licenses
        run: |
          set -e
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "::error::ANDROID_HOME not found at $SDK_DIR"
            exit 1
          fi
          sudo chown -R "$(whoami)" "$SDK_DIR" || true
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_DIR/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" || true
          echo "::notice::Configured Android SDK at $SDK_DIR"

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: 'basic'

      - name: Run unit tests and build Debug APK
        run: |
          set -o pipefail
          if ! gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log; then
            ERR=$(tail -n 60 gradle-build.log | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))')
            echo "::error::Gradle build failed:%0A${ERR}"
            exit 1
          fi
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK produced in app/build/outputs/apk/debug"
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK_PATH")
          APK_SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
          echo "::notice::Built $APK_PATH (${APK_SIZE} bytes, sha256=${APK_SHA})"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: railone-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
